name: Renew Vault TLS Certificate

on:
  # Manual trigger only (you run this when you've renewed the cert locally)
  workflow_dispatch:
    inputs:
      cert_fullchain:
        description: 'Paste the fullchain.pem content here'
        required: true
        type: string
      cert_privkey:
        description: 'Paste the privkey.pem content here'
        required: true
        type: string
      cert_chain:
        description: 'Paste the chain.pem content here'
        required: true
        type: string

jobs:
  update-certificates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Update HCP Terraform variables
        env:
          HCP_TERRAFORM_TOKEN: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          HCP_ORG: "Infragoose"
          HCP_WORKSPACE: "vault-enterprise"
          FULLCHAIN: ${{ inputs.cert_fullchain }}
          PRIVKEY: ${{ inputs.cert_privkey }}
          CHAIN: ${{ inputs.cert_chain }}
        run: |
          echo "Updating certificate variables in HCP Terraform..."

          # Get workspace ID
          WORKSPACE_RESPONSE=$(curl -s \
            --header "Authorization: Bearer $HCP_TERRAFORM_TOKEN" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/$HCP_ORG/workspaces/$HCP_WORKSPACE")

          WORKSPACE_ID=$(echo "$WORKSPACE_RESPONSE" | jq -r '.data.id')

          if [ "$WORKSPACE_ID" == "null" ]; then
            echo "❌ Error: Could not get workspace ID"
            echo "Response: $WORKSPACE_RESPONSE"
            exit 1
          fi

          echo "✓ Workspace ID: $WORKSPACE_ID"

          # Function to update variable
          update_variable() {
            local var_name=$1
            local var_value=$2

            echo "Updating variable: $var_name"

            # Get existing variable ID
            VARS_RESPONSE=$(curl -s \
              --header "Authorization: Bearer $HCP_TERRAFORM_TOKEN" \
              --header "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/workspaces/$WORKSPACE_ID/vars")

            VAR_ID=$(echo "$VARS_RESPONSE" | jq -r ".data[] | select(.attributes.key == \"$var_name\") | .id")

            # Prepare JSON payload
            JSON_PAYLOAD=$(jq -n \
              --arg key "$var_name" \
              --arg value "$var_value" \
              --arg description "Updated via GitHub Actions on $(date +%Y-%m-%d)" \
              '{
                data: {
                  type: "vars",
                  attributes: {
                    key: $key,
                    value: $value,
                    description: $description,
                    category: "terraform",
                    hcl: false,
                    sensitive: true
                  }
                }
              }')

            if [ "$VAR_ID" != "null" ] && [ -n "$VAR_ID" ]; then
              # Update existing variable
              RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
                --header "Authorization: Bearer $HCP_TERRAFORM_TOKEN" \
                --header "Content-Type: application/vnd.api+json" \
                --request PATCH \
                --data "$JSON_PAYLOAD" \
                "https://app.terraform.io/api/v2/workspaces/$WORKSPACE_ID/vars/$VAR_ID")

              HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)

              if [ "$HTTP_CODE" == "200" ]; then
                echo "✓ Successfully updated $var_name"
              else
                echo "❌ Failed to update $var_name (HTTP $HTTP_CODE)"
                echo "$RESPONSE"
                exit 1
              fi
            else
              echo "❌ Variable $var_name not found in workspace"
              exit 1
            fi
          }

          # Update all three certificate variables
          update_variable "vault_tls_cert" "$FULLCHAIN"
          update_variable "vault_tls_key" "$PRIVKEY"
          update_variable "vault_ca_bundle" "$CHAIN"

          echo ""
          echo "✅ All certificate variables updated successfully!"

      - name: Summary
        run: |
          echo "## Certificate Update Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The certificate variables have been updated in HCP Terraform." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to [HCP Terraform Workspace](https://app.terraform.io/app/Infragoose/workspaces/vault-enterprise)" >> $GITHUB_STEP_SUMMARY
          echo "2. Review the changes (variables tab)" >> $GITHUB_STEP_SUMMARY
          echo "3. Queue a plan and apply" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Vault will automatically reload with new certificates. No downtime required!" >> $GITHUB_STEP_SUMMARY
